<!-- 💡 인앱 업데이트: 서비스워커·캐시를 비우고 새로고침해 최신 배포판을 받는다.
     무슨 일이 있어도 2.5초 안에는 반드시 새로고침되도록 안전장치를 건다. -->
<script>
  window.kustForceUpdate = function () {
    var done = false;
    function go() { if (!done) { done = true; window.location.reload(); } }
    setTimeout(go, 2500);
    try {
      var jobs = [];
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) {
            // 💡 SW 매니페스트 캐시는 남긴다 — 지우면 SW가 캐시를 전부 리셋해
            //    아래에서 보존한 사진까지 함께 날아간다
            if (k.indexOf('manifest') !== -1) return false;
            return caches.open(k).then(function (c) {
              return c.keys().then(function (reqs) {
                return Promise.all(reqs.map(function (req) {
                  // 💡 포인트 사진은 보존 (업데이트 때마다 재다운로드 방지)
                  if (req.url.indexOf('/site_photos/') !== -1) return false;
                  return c.delete(req);
                }));
              });
            });
          }));
        }));
      }
      Promise.all(jobs.map(function (p) { return p.catch(function () {}); }))
        .then(go, go);
    } catch (e) { go(); }
  };
</script>

<!-- Flutter 부트스트랩 스크립트 -->
<script src="flutter_bootstrap.js" async=""></script>

<script>
  window.addEventListener('load', function(ev) {
    // 1. Firebase Messaging 서비스 워커 수동 등록 (iOS PWA 대응)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js', {
        scope: '/mini_scuba_app/' // 앱이 서브디렉토리에 있다면 경로 지정, 루트면 '/'
      }).then(function(reg) {
        console.log('Firebase SW 등록 성공:', reg.scope);
      }).catch(function(err) {
        console.log('Firebase SW 등록 실패:', err);
      });
    }
  });
</script>
