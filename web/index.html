<body>


<!-- Flutter 부트스트랩 스크립트 -->
<script src="flutter_bootstrap.js" async=""></script>

<script>
  window.addEventListener('load', function(ev) {
    // 1. Firebase Messaging 서비스 워커 수동 등록 (iOS PWA 대응)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js', {
        scope: '/mini_scuba_app/' // 앱이 서브디렉토리에 있다면 경로 지정, 루트면 '/'
      }).then(function(reg) {
        console.log('Firebase SW 등록 성공:', reg.scope);
      }).catch(function(err) {
        console.log('Firebase SW 등록 실패:', err);
      });
    }
  });
</script>
</body>
</html>
